<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ChainSight | SBOM Risk Dashboard{% endblock %}</title>
    
    <!-- SEO Best Practices -->
    <meta name="description" content="ChainSight automated Software Bill of Materials (SBOM) dependency traversal and security risk-scoring dashboard.">
    <meta name="author" content="ChainSight Team">
    <meta name="robots" content="index, follow">
    
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar-nav">
        <div class="logo-container">
            <div class="logo-icon">
                <!-- Shield Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
            </div>
            <span class="logo-text">ChainSight</span>
        </div>
        
        <ul class="nav-links">
            <li class="nav-item {% if request.path == '/' %}active{% endif %}" id="nav-apps">
                <a href="{{ url_for('index') }}">
                    <!-- Layout Grid Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="9" rx="1"/>
                        <rect x="14" y="3" width="7" height="5" rx="1"/>
                        <rect x="14" y="12" width="7" height="9" rx="1"/>
                        <rect x="3" y="16" width="7" height="5" rx="1"/>
                    </svg>
                    <span>Applications</span>
                </a>
            </li>
            <li class="nav-item {% if request.path == '/library-search' %}active{% endif %}" id="nav-search">
                <a href="{{ url_for('library_search') }}">
                    <!-- Search/Lookup Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    <span>Library Search</span>
                </a>
            </li>
            
            {% if app %}
            <li class="nav-item active" id="nav-report-active">
                <a href="{{ url_for('risk_report', app_id=app.id) }}">
                    <!-- File Text Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                        <polyline points="10 9 9 9 8 9"/>
                    </svg>
                    <span>Report: {{ app.name }}</span>
                </a>
            </li>
            {% endif %}
        </ul>
        
        <div class="nav-footer">
            <p>ChainSight Beta</p>
            <p>Société Générale Hack</p>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content" id="main-content-area">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
